# CI + Deploy — see docs/adr/ADR-020-ci-minimal-github-actions.md
#
# Four jobs:
#   1. check-and-build  — runs on every push and PR; quality gate.
#   2. php              — runs on every push and PR; lint + unit tests of the
#                         sales API in public/api (ADR-028, docs/ventas).
#   3. deploy-staging   — runs ONLY on push to dev, after 1 and 2 pass;
#                         uploads a staging-only build to /staging/
#                         (staging.fenia.com.ar). See the guard in the job.
#   4. deploy           — runs ONLY on push to main, after 1 and 2 pass;
#                         uploads dist/ to Hostinger via FTPS. Requires the
#                         HOSTINGER_FTP_* secrets.
#
# Configure secrets at:
#   Repo → Settings → Secrets and variables → Actions → New repository secret
# Required: HOSTINGER_FTP_HOST, HOSTINGER_FTP_PORT, HOSTINGER_FTP_USER,
#           HOSTINGER_FTP_PASSWORD, HOSTINGER_FTP_REMOTE_DIR

name: CI + Deploy

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Cancel in-progress runs for the same ref when a new push lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-and-build:
    name: astro check + build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard — no paid kit files or credentials in this public repo
        # docs/ventas/test-plan.md OPS-01 and OPS-06. The repo is public: a
        # committed kit ZIP is a kit given away; a committed token is a leak.
        run: |
          archives=$(git ls-files '*.zip' '*.7z' '*.rar')
          if [ -n "$archives" ]; then
            echo "::error::Archive files must never be committed (paid kits live outside the repo): $archives"
            exit 1
          fi
          if git grep -nIE 'APP_USR-[0-9]{6,}|TEST-[0-9]{6,}-'; then
            echo "::error::Something that looks like a Mercado Pago credential is committed. Revoke it in Mercado Pago, then remove it."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Reads engines.node from package.json — keeps CI in lockstep
          # with local dev and the build environment.
          node-version-file: 'package.json'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Astro check (TypeScript + Astro diagnostics)
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Sales catalogue matches the product .md files (test U-31)
        # The PHP backend charges the price in dist/api/catalog.json; this
        # proves it is exactly the price shown on the cards (ADR-028).
        run: node scripts/verify-catalog.mjs

      - name: Upload dist/ artifact
        # Only on pushes that deploy: main → production, dev → staging
        # (docs/ventas, step 2.1). Other branches and PRs don't need it.
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error
          # CRITICAL: v4 strips files starting with `.` from the tarball by
          # default. We need `.htaccess` (the entire hosting config under
          # ADR-023) to survive the artifact round-trip into the deploy job.
          # Without this, .htaccess never reaches Hostinger.
          include-hidden-files: true

  php:
    name: PHP lint + unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 8.1 = lowest version the code supports; 8.3 = what Hostinger runs
        # (confirmed 2026-11-06, docs/ventas/README.md Q1).
        php: ['8.1', '8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install PHPUnit (dev-only — nothing from vendor/ is deployed)
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Lint every PHP file that ships to the server
        run: find public/api -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Unit tests (docs/ventas/test-plan.md, level U)
        run: vendor/bin/phpunit

  deploy-staging:
    # docs/ventas step 2.1, decision D12. Hostinger's API cannot create FTP
    # accounts, so staging reuses the production FTP account, which is jailed
    # to production's public_html. Staging is its /staging/ subfolder, so a
    # wrong server-dir here would overwrite the live site: the guard below
    # makes the job fail unless the target is exactly /staging/.
    name: Deploy dev to staging.fenia.com.ar via FTPS
    needs: [check-and-build, php]
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: staging
      url: https://staging.fenia.com.ar/
    env:
      STAGING_SERVER_DIR: /staging/

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          cache: 'npm'

      - name: Build the staging site (kits on sale in the Mercado Pago sandbox)
        # PUBLIC_SALES_PREVIEW makes coming-soon kits purchasable on staging
        # only (src/lib/sales.ts); production's build never sets it.
        run: |
          npm ci
          npm run build
        env:
          PUBLIC_SALES_PREVIEW: 'true'

      - name: Guard — only ever deploy into /staging/
        run: |
          if [ "$STAGING_SERVER_DIR" != "/staging/" ]; then
            echo "::error::Staging target must be exactly /staging/ (got '$STAGING_SERVER_DIR'). '/' is PRODUCTION."
            exit 1
          fi

      - name: Make the build staging-only (host lock, noindex, hidden files)
        run: node scripts/prepare-staging.mjs dist

      - name: First publish only — seed an empty sync-state file
        # Approved by the dev on 2026-11-06 (docs/ventas, bitácora). With no
        # state file in the target, FTP-Deploy-Action 4.3.5 tries to download
        # it, Hostinger's FTP server resets the data socket on the missing
        # file, and the action aborts with ECONNRESET (run 42315549131 and its
        # re-run). An empty state makes it upload everything as new. Writes
        # only <STAGING_SERVER_DIR>.ftp-deploy-sync-state.json, and only if it
        # is missing; the existence check uses SIZE (curl -I), which opens no
        # data connection.
        env:
          FTP_HOST: ${{ secrets.HOSTINGER_FTP_HOST }}
          FTP_PORT: ${{ secrets.HOSTINGER_FTP_PORT }}
          FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
          FTP_PASS: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          umask 077
          printf 'machine %s login %s password %s\n' "$FTP_HOST" "$FTP_USER" "$FTP_PASS" > "$RUNNER_TEMP/netrc"
          url="ftp://${FTP_HOST}:${FTP_PORT}${STAGING_SERVER_DIR}.ftp-deploy-sync-state.json"
          if curl -sS -I --ssl-reqd --insecure --netrc-file "$RUNNER_TEMP/netrc" "$url" > /dev/null 2>&1; then
            echo "State file already on the server: nothing to seed."
          else
            printf '{"description":"DO NOT DELETE THIS FILE. Seeded empty by CI for the first staging publish (docs/ventas 2.1).","version":"1.0.0","generatedTime":%s000,"data":[]}' "$(date +%s)" > "$RUNNER_TEMP/state.json"
            curl -sS --ssl-reqd --insecure --netrc-file "$RUNNER_TEMP/netrc" -T "$RUNNER_TEMP/state.json" "$url"
            echo "Seeded an empty state file in ${STAGING_SERVER_DIR}."
          fi
          rm -f "$RUNNER_TEMP/netrc"

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST }}
          port: ${{ secrets.HOSTINGER_FTP_PORT }}
          username: ${{ secrets.HOSTINGER_FTP_USER }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ env.STAGING_SERVER_DIR }}
          protocol: ftps
          # Same reason as the production job below.
          security: loose
          dangerous-clean-slate: false
          state-name: .ftp-deploy-sync-state.json
          # The dry-run rehearsal (run 42315393927) was reviewed: 41 files,
          # all under /staging/. Real uploads from here on.
          dry-run: false

  deploy:
    name: Deploy to Hostinger via FTPS
    needs: [check-and-build, php]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://fenia.com.ar/

    steps:
      - name: Download dist/ artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Validate FTPS secrets are configured
        # Fast-fail with a clear message if the owner hasn't supplied creds.
        # Otherwise the FTP action errors halfway through with a less obvious
        # "missing host" message.
        run: |
          missing=()
          [ -z "${{ secrets.HOSTINGER_FTP_HOST }}" ] && missing+=("HOSTINGER_FTP_HOST")
          [ -z "${{ secrets.HOSTINGER_FTP_PORT }}" ] && missing+=("HOSTINGER_FTP_PORT")
          [ -z "${{ secrets.HOSTINGER_FTP_USER }}" ] && missing+=("HOSTINGER_FTP_USER")
          [ -z "${{ secrets.HOSTINGER_FTP_PASSWORD }}" ] && missing+=("HOSTINGER_FTP_PASSWORD")
          [ -z "${{ secrets.HOSTINGER_FTP_REMOTE_DIR }}" ] && missing+=("HOSTINGER_FTP_REMOTE_DIR")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            echo "::error::Configure at: Repo → Settings → Secrets and variables → Actions"
            echo "::error::See docs/ai-context/deployment.md for what each value should be."
            exit 1
          fi

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST }}
          port: ${{ secrets.HOSTINGER_FTP_PORT }}
          username: ${{ secrets.HOSTINGER_FTP_USER }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.HOSTINGER_FTP_REMOTE_DIR }}
          protocol: ftps
          # `loose` (vs `strict`) skips TLS hostname/IP verification.
          # Required because HOSTINGER_FTP_HOST is the server IP, while
          # Hostinger's cert covers `*.hstgr.io` only — strict would reject.
          # Trade-off: the connection is still TLS-encrypted (creds in
          # transit are safe), but we do not validate the server's identity.
          # Acceptable for this deploy: payload is the public site (no
          # secrets in dist/); FTP creds are the only exposed surface and
          # they're rotated per the security checklist. Revisit if Fab moves
          # to a plan with a hostname under `*.hstgr.io` we can use.
          security: loose
          # Keep prior files that aren't part of dist/ untouched (avoids
          # nuking mail config, Hostinger's own .well-known, etc.).
          dangerous-clean-slate: false
          # Diff-sync state file. Speeds up subsequent deploys.
          state-name: .ftp-deploy-sync-state.json
          # Don't try to delete files we never uploaded; reduces surprises.
          dry-run: false
