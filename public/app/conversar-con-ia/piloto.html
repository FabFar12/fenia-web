/* Layout: una columna de celular (máx. 480px). Cada pantalla trae su modo:
   oscuro = pensar (recordar, predecir, decidir) · claro = hacer y leer. */
:root {
  --noche: #0B1A2E;
  --noche-2: #13263F;
  --noche-3: #24405F;
  --borde-osc: #2C4867;
  --blanco: #FFFFFF;
  --tenue-osc: #B9C6D6;
  --tenue-osc-2: #9FB0C4;
  --cian: #00B4D8;
  --papel: #F4F6F9;
  --tinta: #0B1A2E;
  --tinta-2: #2B3A4F;
  --tenue: #4A5A70;
  --linea: #DCE3EC;
  --linea-2: #C5D0DD;
  --cian-prof: #006B87;
  --cian-suave: #E3F1F5;
  --cian-borde: #B5DCE6;
  --cian-osc: #0F3B4C;
  --marca: #D2ECF3;
  --coral: #E8543C;
  --accion: #CF4630;
  --coral-texto: #B23C27;
  --ambar: #F2B544;
  --ambar-texto: #7A4F00;
  --ambar-suave: #FFF3DA;
  --ambar-borde: #EBC97A;
  --ambar-osc: #33280F;
  --fuente: 'Plus Jakarta Sans', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --inset-top: env(safe-area-inset-top, 0px);
  --inset-bottom: env(safe-area-inset-bottom, 0px);
  --gutter-l: max(20px, env(safe-area-inset-left, 0px));
  --gutter-r: max(20px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--noche);
  color: var(--blanco);
  font-family: var(--fuente);
  font-size: 17px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, input, textarea { font-family: inherit; font-size: inherit; }
button { -webkit-appearance: none; appearance: none; }
:focus-visible { outline: 3px solid var(--cian); outline-offset: 2px; }
.claro :focus-visible { outline-color: var(--cian-prof); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#app { height: 100%; display: flex; justify-content: center; background: var(--noche); }
.pantalla {
  width: 100%; max-width: 480px; height: 100%;
  display: flex; flex-direction: column; position: relative; overflow: hidden;
  transition: background-color .35s ease, color .35s ease;
}
@media (min-width: 560px) {
  #app { background: radial-gradient(ellipse at 50% 0%, #10304A 0%, var(--noche) 60%); padding-block: 24px; }
  .pantalla { border-radius: 28px; box-shadow: 0 30px 80px -30px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.06); max-height: 900px; align-self: center; }
}
.oscuro { background: var(--noche); color: var(--blanco); color-scheme: dark;
  --op-fondo: var(--noche-2); --op-borde: var(--borde-osc); --op-on-fondo: var(--cian-osc); --op-on-borde: var(--cian);
  --tx-tenue: var(--tenue-osc); --eyebrow: var(--cian); --card: var(--noche-2); --card-borde: var(--noche-3);
  --seg-off: var(--noche-3); --seg-on: var(--cian); --icono-borde: var(--noche-3); }
.claro { background: var(--papel); color: var(--tinta); color-scheme: light;
  --op-fondo: var(--blanco); --op-borde: var(--linea-2); --op-on-fondo: var(--cian-suave); --op-on-borde: var(--cian-prof);
  --tx-tenue: var(--tenue); --eyebrow: var(--cian-prof); --card: var(--blanco); --card-borde: var(--linea);
  --seg-off: var(--linea); --seg-on: var(--cian-prof); --icono-borde: var(--linea); }

.gutter { padding-left: var(--gutter-l); padding-right: var(--gutter-r); }

/* ---------- barra superior ---------- */
.barra { display: flex; align-items: center; gap: 12px; padding-top: calc(12px + var(--inset-top)); padding-bottom: 8px; }
.icono-btn {
  width: 44px; height: 44px; flex: none; border-radius: 12px;
  border: 1px solid var(--icono-borde); background: var(--card); color: inherit;
  display: inline-flex; align-items: center; justify-content: center; cursor: pointer; text-decoration: none;
}
.icono-btn svg { width: 20px; height: 20px; }
.segmentos { flex: 1; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; }
.seg { height: 6px; border-radius: 3px; background: var(--seg-off); transition: background-color .3s; }
.seg.hecho { background: var(--seg-on); }
.seg.actual { background: var(--coral); }
.tiempo { font-size: 14px; font-weight: 700; color: var(--tx-tenue); min-width: 58px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ---------- cuerpo y pie ---------- */
.cuerpo { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.contenido { display: flex; flex-direction: column; padding-block: 18px 24px; }
.entra { animation: entra .38s cubic-bezier(.2,.7,.2,1) both; }
@keyframes entra { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.pie { padding-top: 10px; padding-bottom: calc(18px + var(--inset-bottom)); display: flex; flex-direction: column; gap: 4px; }
.oscuro .pie { background: linear-gradient(to top, var(--noche) 70%, rgba(11,26,46,0)); }
.claro .pie { background: linear-gradient(to top, var(--papel) 70%, rgba(244,246,249,0)); }

/* ---------- tipografía ---------- */
.eyebrow { font-size: 15px; font-weight: 700; line-height: 1.35; color: var(--eyebrow); margin: 0; }
.titulo { margin: 0; font-size: 30px; line-height: 1.14; font-weight: 800; letter-spacing: -.015em; text-wrap: balance; }
.titulo:focus { outline: none; }
.titulo-xl { font-size: 34px; line-height: 1.08; }
.lead { margin: 0; font-size: 17px; line-height: 1.5; color: var(--tx-tenue); }
.texto { margin: 0; font-size: 17px; line-height: 1.55; }
.chico { margin: 0; font-size: 14px; line-height: 1.45; color: var(--tx-tenue); }
.cian { color: var(--cian); }

/* ---------- botones ---------- */
.btn {
  min-height: 56px; width: 100%; border-radius: 16px; border: 0;
  font-weight: 800; font-size: 17px; line-height: 1.2; letter-spacing: -.005em;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 18px;
  cursor: pointer; text-decoration: none; transition: transform .12s ease, background-color .2s ease, box-shadow .2s ease;
}
.btn:active { transform: scale(.98); }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn-accion { background: var(--accion); color: var(--blanco); }
.oscuro .btn-accion { box-shadow: 0 10px 28px -10px rgba(232,84,60,.6); }
.btn-accion[disabled] { background: var(--linea); color: var(--tenue); box-shadow: none; cursor: not-allowed; transform: none; }
.oscuro .btn-accion[disabled] { background: var(--noche-3); color: var(--tenue-osc-2); }
.btn-claro { background: var(--blanco); color: var(--tinta); }
.btn-borde { background: transparent; color: inherit; border: 2px solid var(--op-borde); }
.btn-texto { min-height: 44px; width: 100%; border: 0; background: none; color: var(--tx-tenue); font-weight: 700; font-size: 15px; cursor: pointer; border-radius: 12px; }
.btn-texto.sub { text-decoration: underline; text-underline-offset: 3px; font-weight: 600; }
.btn-chico { min-height: 48px; border-radius: 12px; font-size: 16px; }

/* ---------- opciones ---------- */
.opciones { display: flex; flex-direction: column; gap: 10px; }
.opcion {
  min-height: 60px; width: 100%; border-radius: 16px; border: 2px solid var(--op-borde); background: var(--op-fondo); color: inherit;
  display: flex; align-items: center; gap: 14px; padding: 12px 16px; text-align: left;
  font-size: 17px; font-weight: 700; line-height: 1.3; cursor: pointer; transition: border-color .15s, background-color .15s;
}
.opcion[aria-checked="true"], .opcion[aria-pressed="true"] { border-color: var(--op-on-borde); background: var(--op-on-fondo); }
.marca { width: 22px; height: 22px; flex: none; border-radius: 50%; border: 2px solid var(--op-borde); display: inline-flex; align-items: center; justify-content: center; }
.marca::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: transparent; }
[aria-checked="true"] > .marca { border-color: var(--op-on-borde); }
[aria-checked="true"] > .marca::after { background: var(--op-on-borde); }
.marca.cuadro { border-radius: 6px; }
.marca.cuadro::after { display: none; }

  /* ---------- mapa de nodos (portada y recorrido) ---------- */
  function mapa(o) {
    var xs = [80, 140, 200, 260, 320], jit = [0, 8, -6, 7, -3], pts = [{ x: 22, y: 28, k: -1 }];
    for (var r = 0; r < 6; r++) for (var i = 0; i < 5; i++) { var col = r % 2 === 0 ? i : 4 - i; pts.push({ x: xs[col], y: 28 + r * 56 + jit[col], k: r * 5 + i }); }
    var prox = proxima();
    var actual, hasta;
    if (o.inicio || !E.dia0.hecho) { actual = 0; hasta = -1; }
    else { hasta = hechas(); actual = prox ? hasta + 1 : -1; }
    var todo = pts.map(function (p) { return p.x + ',' + p.y; }).join(' ');
    var hecho = hasta >= 0 ? pts.slice(0, (actual > 0 ? actual : hasta) + 1).map(function (p) { return p.x + ',' + p.y; }).join(' ') : '';
    var out = '<svg class="mapa" viewBox="0 0 350 336" role="img" aria-label="' + esc(o.label) + '">';
    out += '<polyline class="ruta' + (o.anim ? ' ruta-anim' : '') + '" pathLength="1" points="' + todo + '"/>';
    if (hecho) out += '<polyline class="ruta-hecha" points="' + hecho + '"/>';
    pts.forEach(function (p, j) {
      var mix = p.k >= 0 && (p.k + 1) % 5 === 0;
      var estado = j === actual ? 'hoy' : (j <= hasta ? 'hecho' : (p.k < 5 ? 'sem' : 'bloq'));
      var g = '<g class="' + (o.anim ? 'nodo-anim' : '') + '" data-i="' + j + '">';
      var rr = estado === 'hoy' ? 10 : estado === 'hecho' ? 7 : estado === 'sem' ? 6 : 4.5;
      if (estado === 'hecho') g += '<circle class="n-halo" cx="' + p.x + '" cy="' + p.y + '" r="12"/>';
      if (estado === 'hoy') g += '<circle class="n-pulso" cx="' + p.x + '" cy="' + p.y + '" r="10"/>';
      var cls = estado === 'hoy' ? 'n-hoy' : estado === 'hecho' ? 'n-hecho' : estado === 'sem' ? 'n-sem' : 'n-bloq';
      if (mix) g += '<rect class="' + cls + '" x="' + (p.x - rr * 0.82) + '" y="' + (p.y - rr * 0.82) + '" width="' + (rr * 1.64) + '" height="' + (rr * 1.64) + '" rx="2" transform="rotate(45 ' + p.x + ' ' + p.y + ')"/>';
      else g += '<circle class="' + cls + '" cx="' + p.x + '" cy="' + p.y + '" r="' + rr + '"/>';
      if (estado === 'hoy') g += '<circle class="n-hoy-punto" cx="' + p.x + '" cy="' + p.y + '" r="3.5"/>';
      g += '</g>';
      out += g;
    });
    if (o.inicio) out += '<text class="et-mapa" x="8" y="60">EMPEZÁS ACÁ</text>';
    return out + '</svg>';
  }

      var op = x.opciones.filter(function (o) { return o.id === elegido; })[0];

  function botonesCalendario() {

    var ics = '<button type="button" class="btn btn-chico btn-borde" data-a="ics">' + I.calendario + 'Agregar recordatorio al calendario</button>';
    return esAndroid()
      ? gcal + '<button type="button" class="btn-texto" data-a="ics">¿Usás otro calendario? Descargá el archivo</button>'
      : ics + '<button type="button" class="btn-texto" data-a="gcal">O agregalo a Google Calendar</button>';
  }
  A.gcal = function () {
    var hm = (E.hora || '09:00').split(':');
    var d = new Date(); d.setDate(d.getDate() + 1);
    while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() + 1);
    var ini = new Date(d.getFullYear(), d.getMonth(), d.getDate(), +hm[0], +hm[1]);
    var fin = new Date(ini.getTime() + 5 * 60000);
    function f(x) { return x.getFullYear() + pad(x.getMonth() + 1) + pad(x.getDate()) + 'T' + pad(x.getHours()) + pad(x.getMinutes()) + '00'; }
    var zona = 'America/Argentina/Buenos_Aires';
    try { zona = Intl.DateTimeFormat().resolvedOptions().timeZone || zona; } catch (e) { }
    var url = 'https://calendar.google.com/calendar/render?action=TEMPLATE' +
      '&text=' + encodeURIComponent('5 minutos de FENIA') +
      '&details=' + encodeURIComponent('Después ' + conDe(momentoTxt()) + ', abrí Conversar con IA y hacé tu sesión del día: ' + location.href.split('#')[0]) +
      '&dates=' + f(ini) + '/' + f(fin) + '&ctz=' + encodeURIComponent(zona) +
      '&recur=' + encodeURIComponent('RRULE:FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR;COUNT=30');
    window.open(url, '_blank', 'noopener');
    ui.icsMsg = 'Se abrió Google Calendar: revisá la hora y tocá Guardar.';
    render();
  };

  function navegadorInterno() {
    var ua = navigator.userAgent || '';
    if (/Instagram/i.test(ua)) return 'Instagram';
    if (/FBAN|FBAV|FB_IAB|FBIOS/i.test(ua)) return 'Facebook';
    if (/TikTok|musical_ly|BytedanceWebview/i.test(ua)) return 'TikTok';
    return null;
  }
  function avisoNavegador() {
    var donde = navegadorInterno();
    if (!donde) return '';
    var url = location.href.split('#')[0];
    var h = '<div class="aviso-piloto aviso-navegador" role="note">' +
      '<p class="texto"><b>Antes de empezar.</b> Estás dentro de ' + esc(donde) + '. Si hacés el día 0 acá, tu progreso puede borrarse cuando cierres la app. Abrilo en tu navegador.</p>';
    if (esAndroid()) {
      h += '<a class="btn btn-chico btn-borde" href="' + esc('intent://' + location.host + location.pathname + location.search +
        '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' + encodeURIComponent(url) + ';end') + '">Abrir en Chrome</a>';
    } else {
      h += '<p class="texto">Tocá <b>⋯</b> arriba a la derecha y elegí <b>Abrir en el navegador</b>.</p>';
    }
    return h + '<button type="button" class="btn-texto" data-a="copiarLink">' + (ui.linkCopiado ? 'Link copiado: pegalo en tu navegador' : 'Copiar el link') + '</button></div>';
  }
  A.copiarLink = function () {
    copiarTexto(location.href.split('#')[0], function () { ui.linkCopiado = true; render(); }, function () { });
  };

  // The bottom bar hides while the keyboard is open: the field stays in view.
  // The keyboard shrinks the visible area; desktops never get here.
  (function teclado() {
    var vv = window.visualViewport;
    if (!vv) return;
    var alto = vv.height;
    function escribiendo() {
      var el = document.activeElement;
      return !!el && app.contains(el) && (el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && /^(text|search|email|url|tel)?$/i.test(el.getAttribute('type') || '')));
    }
    function revisar() {
      if (!escribiendo()) alto = Math.max(alto, vv.height);
      document.documentElement.classList.toggle('tecleando', escribiendo() && vv.height < alto - 120);
    }
    vv.addEventListener('resize', revisar);
    document.addEventListener('focusin', revisar);
    document.addEventListener('focusout', function () { setTimeout(revisar, 60); });
    window.addEventListener('orientationchange', function () { setTimeout(function () { alto = vv.height; revisar(); }, 400); });
  })();

  ui.vista = resolver(location.hash);
  render();
})();

</script>
